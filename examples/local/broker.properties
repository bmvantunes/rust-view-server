# Derived local-only template; ephemeral paths/ports are supplied by the launcher.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:34493
listeners=PLAINTEXT://127.0.0.1:34492,CONTROLLER://127.0.0.1:34493
advertised.listeners=PLAINTEXT://127.0.0.1:34492
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
log.dirs=@BROKER_DATA@
num.partitions=2
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.num.partitions=1
offsets.topic.num.partitions=1
group.initial.rebalance.delay.ms=0
log.cleaner.enable=true
log.cleaner.backoff.ms=1000
log.segment.bytes=1048576
log.retention.check.interval.ms=1000
